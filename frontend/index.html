<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="description" content="แผนที่ปักหมุดแมวในพื้นที่ ถ่ายรูปแล้วปักหมุดแมวที่คุณเจอ" />
    <title>MeowPin — แผนที่แมวเหมียว</title>
    <script>
      // ใส่ธีมมืดก่อนหน้าเว็บวาดครั้งแรก กันจอกระพริบขาว (ค่าเดียวกับ src/hooks/useTheme.ts)
      try {
        var t = localStorage.getItem('meowpin.theme')
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
